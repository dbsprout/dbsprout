{# Friendly error fragment for HTMX swap targets (S-116). #}
{# Renders the typed envelope from ``dbsprout.web.errors.WebError.to_dict()``. #}
<div class="dbsprout-error"
     role="alert"
     aria-live="polite"
     data-code="{{ error.code }}"
     data-status="{{ status_code }}">
  <strong class="dbsprout-error-code">{{ error.code }}</strong>
  <p class="dbsprout-error-message">{{ error.message }}</p>
  {% if error.hint %}
  <p class="dbsprout-error-hint">{{ error.hint }}</p>
  {% endif %}
  <small class="dbsprout-error-correlation">Correlation ID: <code>{{ error.correlation_id }}</code></small>
</div>
