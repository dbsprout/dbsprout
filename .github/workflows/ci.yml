name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra data --extra stats --extra tui --extra web

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: MyPy strict
        run: uv run mypy --strict dbsprout/

      - name: Bandit security scan
        run: uv run bandit -c pyproject.toml -r dbsprout/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra data --extra stats --extra tui --extra web

      - name: Run tests with coverage
        run: uv run pytest --cov=dbsprout --cov-report=term-missing --cov-fail-under=95

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra data --extra stats

      - name: Run benchmarks
        run: >-
          uv run pytest benchmarks/
          --benchmark-json=benchmark-results.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark-results.json

  benchmark-gate:
    name: Benchmark Regression Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d # v7
        with:
          version: "0.11.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra data --extra stats

      - name: Run benchmarks
        run: >-
          uv run pytest benchmarks/
          --benchmark-json=benchmark-results.json

      - name: Check for >20% regression vs committed baseline
        # Advisory: short microbenchmarks are noisy on shared GitHub runners
        # (run-to-run variance routinely exceeds the 20% threshold), so a
        # detected regression is surfaced in the log without blocking the
        # merge. Promote to a hard gate once it runs on a dedicated runner.
        continue-on-error: true
        run: >-
          uv run python benchmarks/check_regression.py
          --baseline benchmarks/baseline.json
          --current benchmark-results.json
